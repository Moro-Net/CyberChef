name: Sync from Upstream

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  sync:
    name: Sync with upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.UPSTREAM_SYNC }}

      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: gchq/CyberChef
          upstream_sync_branch: master
          target_sync_branch: master
          test_mode: false
        
      - name: Check for new commits
        id: check
        if: success()
        run: echo "Sync completed successfully"

      - name: Check for Failure
        if: failure()
        run: echo "[Error] Sync failed. This might be due to change in upstream workflow file, merge conflicts. Check logs and consider manual sync.
